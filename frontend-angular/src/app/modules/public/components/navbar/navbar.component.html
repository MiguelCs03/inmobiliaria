<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-container">
    <!-- Logo -->
    <a class="nav-logo" routerLink="/" (click)="closeMenu()">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="logo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-18M2.25 9l4.5-1.636M18.75 3l-1.5.545m0 6.205l3 1m1.5.5l-1.5-.5M6.75 7.364V3h-3v18m3-13.636l10.5-3.819" />
      </svg>
      <span class="logo-text">Inmobiliaria</span>
    </a>

    <!-- Nav Links -->
    <div class="nav-links" [class.open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        class="nav-link"
      >Home</a>
      <a
        routerLink="/quienes-somos"
        routerLinkActive="active"
        (click)="closeMenu()"
        class="nav-link"
      >Quiénes Somos</a>
    </div>

    <!-- Right -->
    <div class="nav-right">
      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile overlay -->
  <div class="mobile-overlay" *ngIf="menuOpen" (click)="closeMenu()"></div>
</nav>
