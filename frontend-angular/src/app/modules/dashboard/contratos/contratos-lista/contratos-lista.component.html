<div class="propiedades-wrapper card catalog-full-card">

    <!-- Header & Action Bar -->
    <div class="section-header-bar">
        <div class="title-text">
            <h1>Contratos</h1>
            <p>Listado y control de documentos legales</p>
        </div>
        <button type="button" (click)="navegarA()" class="primary-action-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nuevo Contrato
        </button>
    </div>

    <!-- List Body Area -->
    <div class="list-body table-responsive">
        <table class="custom-table-catalog">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Estado</th>
                    <th class="text-right">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="font-mono">1</td>
                    <td class="font-semibold">Contrato Casa Centro</td>
                    <td>
                        <!-- Clases de estado dinámicas basadas en tu lógica de tags -->
                        <span class="tag-status reserved">PENDING</span>
                    </td>
                    <td class="text-right">
                        <button type="button" class="btn-action-view">
                            <svg class="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            Ver
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
